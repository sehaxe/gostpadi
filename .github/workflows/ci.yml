name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: selftest (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Самопроверка (все вариации + инварианты раскладки + эталон геометрии)
        run: uv run --python ${{ matrix.python }} --with matplotlib
             python selftest.py

      - name: Дымовой прогон CLI (схемы из кода и .gvn)
        run: |
          set -e
          uv run --python ${{ matrix.python }} --with matplotlib python gostpadi.py examples/main.c -o /tmp/main.png
          uv run --python ${{ matrix.python }} --with matplotlib python gostpadi.py examples/hello.gvn -o /tmp/hello.png
          uv run --python ${{ matrix.python }} --with matplotlib python gostpadi.py --template > /tmp/new.gvn
          uv run --python ${{ matrix.python }} --with matplotlib python gostpadi.py /tmp/new.gvn -o /tmp/new.png
          test -s /tmp/main.png -a -s /tmp/hello.png -a -s /tmp/new.png

  publish:
    name: publish to pypi
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # trusted publisher на PyPI (sehaxe/gostpadi, ci.yml)
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Собрать пакет
        run: uv build

      - name: Опубликовать на PyPI
        run: uv publish --trusted-publishing always

  release:
    name: release
    needs: [test, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Собрать пакет (sdist + wheel)
        run: uv build

      - name: Проверить установку из wheel в чистое окружение
        run: |
          uv venv /tmp/release-venv
          uv pip install --python /tmp/release-venv/bin/python dist/*.whl
          /tmp/release-venv/bin/gostpadi --version
          /tmp/release-venv/bin/gostpadi examples/main.c -o /tmp/check.png
          test -s /tmp/check.png

      - name: Создать релиз (sdist + wheel)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          case "$tag" in
            *a*|*b*|*rc*) flags="--prerelease";;
            *) flags="";;
          esac
          gh release create "$tag" dist/*.tar.gz dist/*.whl $flags \
            --title "gostpadi $tag" \
            --generate-notes \
            --notes "Проверено CI: самопроверка всех вариаций, эталон геометрии и установка из wheel — зелёные."
