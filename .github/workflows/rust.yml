name: rust
"on":
  push:
    branches: [flowengine, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check
      - run: cargo build --release
      # сайт: docs/gostpadi.wasm — движок для страницы. На main CI сам
      # пересобирает и коммитит его, если исходники ушли вперёд.
      - name: Свежий gostpadi.wasm для сайта
        run: |
          CARGO_PROFILE_RELEASE_OPT_LEVEL=z cargo build --release \
            --lib --target wasm32-unknown-unknown
          test -s target/wasm32-unknown-unknown/release/gostpadi.wasm
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "не main — docs/gostpadi.wasm не трогаем"
            exit 0
          fi
          if ! cmp -s target/wasm32-unknown-unknown/release/gostpadi.wasm docs/gostpadi.wasm; then
            cp target/wasm32-unknown-unknown/release/gostpadi.wasm docs/gostpadi.wasm
            git config user.name "wasm-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/gostpadi.wasm
            git commit -m "wasm: пересборка движка для сайта"
            git push
            echo "wasm обновлён и запушен"
          else
            echo "docs/gostpadi.wasm актуален"
          fi

  # Документация: Astro + Starlight из site/, результат кладётся в
  # docs/docs — рядом с приложением в корне сайта, ничего не ломая.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Установить зависимости
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Собрать документацию
        working-directory: site
        run: bun run build

      # Ссылки внутри страниц абсолютные (/docs/...), поэтому base
      # не меняем: документация лежит по этому пути и на Pages.
      - name: Разложить в docs/docs
        run: |
          test -s site/dist/index.html
          rm -rf docs/docs
          cp -r site/dist docs/docs
          test -s docs/docs/index.html

      - name: Опубликовать документацию
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: |
          git config user.name "docs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/docs
          if git diff --cached --quiet; then
            echo "docs/docs актуальны"
          else
            git commit -m "docs: пересборка документации"
            git push
          fi
