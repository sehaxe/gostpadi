name: rust
"on":
  push:
    branches: [flowengine, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check
      - run: cargo build --release
      # сайт: docs/gostpadi.wasm — движок для страницы. На main CI сам
      # пересобирает и коммитит его, если исходники ушли вперёд.
      - name: Свежий gostpadi.wasm для сайта
        run: |
          CARGO_PROFILE_RELEASE_OPT_LEVEL=z cargo build --release \
            --lib --target wasm32-unknown-unknown
          test -s target/wasm32-unknown-unknown/release/gostpadi.wasm
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "не main — docs/gostpadi.wasm не трогаем"
            exit 0
          fi
          if ! cmp -s target/wasm32-unknown-unknown/release/gostpadi.wasm docs/gostpadi.wasm; then
            cp target/wasm32-unknown-unknown/release/gostpadi.wasm docs/gostpadi.wasm
            git config user.name "wasm-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/gostpadi.wasm
            git commit -m "wasm: пересборка движка для сайта"
            git push
            echo "wasm обновлён и запушен"
          else
            echo "docs/gostpadi.wasm актуален"
          fi
