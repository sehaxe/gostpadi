name: release
"on":
  push: { tags: ["v*"] }
permissions: { contents: write }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl, ext: "" }
          - { os: macos-14,       target: aarch64-apple-darwin,     ext: "" }
          - { os: macos-13,       target: x86_64-apple-darwin,      ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   ext: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with: { targets: ${{ matrix.target }} }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Прикрепить бинарник к релизу
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        shell: bash
        run: |
          name="gostpadi-${GITHUB_REF_NAME#v}-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/gostpadi${{ matrix.ext }}" "$name"
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            --title "gostpadi $GITHUB_REF_NAME" 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" "$name" --clobber
