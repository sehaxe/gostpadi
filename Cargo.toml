[package]
name = "gostpadi"
version = "2.0.0"
edition = "2021"
description = "ГОСТ 19.701 блок-схемы из C/.gvn — Rust движок, wasm-ready"
repository = "https://github.com/sehaxe/gostpadi"
license = "MIT"

[[bin]]
name = "gostpadi"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
lang-c = "0.15.1"
